<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Базовый глубокий темный тон -->
  <rect width="100%" height="100%" fill="#0a0f1d"/>

  <!-- Размытые световые фито-пятна -->
  <g filter="url(#blurFilter)">
    <circle cx="350" cy="250" r="450" fill="url(#grad1)"/>
    <circle cx="1600" cy="850" r="550" fill="url(#grad2)"/>
    <circle cx="960" cy="540" r="380" fill="#059669" fill-opacity="0.12"/>

    <!-- Растительные контуры и лепестки -->
    <path d="M 150,100 C 350,50 600,200 650,450 C 450,550 200,400 150,100 Z" fill="url(#leafGrad)"/>
    <path d="M 1750,900 C 1500,850 1300,650 1400,400 C 1650,450 1850,700 1750,900 Z" fill="url(#leafGrad)"/>
    <path d="M 850,950 C 1050,750 1200,900 1150,1100 C 950,1150 800,1050 850,950 Z" fill="url(#leafGrad)"/>
  </g>
</svg>
